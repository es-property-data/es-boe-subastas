# Canary semanal: ejecuta el recolector contra la fuente REAL
# con un caso conocido y abre (o actualiza) una incidencia si la salida no
# valida contra el esquema o si el código de salida es 4 (estructura cambiada).
name: Canary

on:
  schedule:
    - cron: "0 6 * * 1" # lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    name: Recolección real contra el portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Subastas concluidas: permanecen en el portal y su estructura es estable.
      KNOWN_IDS: SUB-JA-2026-265003 SUB-RC-2026-07003001815
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar el recolector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Recuperar el caso conocido (fetch)
        id: fetch
        run: |
          set +e
          boe-subastas fetch $KNOWN_IDS -o canary-fetch.jsonl 2> canary-fetch.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat canary-fetch.log

      - name: Buscar en la fuente (search)
        id: search
        run: |
          set +e
          boe-subastas search --province 07 --limit 3 -o canary-search.jsonl 2> canary-search.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat canary-search.log

      - name: Validar la salida contra el esquema
        id: validate
        run: |
          set +e
          python scripts/validate_output.py canary-fetch.jsonl canary-search.jsonl
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Guardar salida y registros como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.run_number }}
          path: |
            canary-*.jsonl
            canary-*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Abrir o actualizar la incidencia
        if: steps.fetch.outputs.exit == '4' || steps.search.outputs.exit == '4' || steps.validate.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FETCH_EXIT: ${{ steps.fetch.outputs.exit }}
          SEARCH_EXIT: ${{ steps.search.outputs.exit }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit }}
        run: |
          gh label create canary --description "Aviso del canary semanal" --color D93F0B --force > /dev/null 2>&1 || true
          title="Canary: el recolector ya no interpreta bien el portal"
          {
            echo "El canary ha detectado un problema en la ejecucion $RUN_URL"
            echo
            echo "- fetch de $KNOWN_IDS: codigo de salida $FETCH_EXIT"
            echo "- search --province 07 --limit 3: codigo de salida $SEARCH_EXIT"
            echo "- validacion contra schemas/item.schema.json: codigo de salida $VALIDATE_EXIT"
            echo
            echo "El codigo 4 significa que el portal ha cambiado su estructura y el parser necesita mantenimiento."
            echo "La salida y los registros estan en los artefactos de la ejecucion."
          } > issue-body.md
          number=$(gh issue list --label canary --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --title "$title" --label canary --body-file issue-body.md
          fi

      - name: Resultado
        if: always()
        env:
          FETCH_EXIT: ${{ steps.fetch.outputs.exit }}
          SEARCH_EXIT: ${{ steps.search.outputs.exit }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit }}
        run: |
          echo "fetch=$FETCH_EXIT search=$SEARCH_EXIT validacion=$VALIDATE_EXIT"
          [ "$FETCH_EXIT" = "0" ] && [ "$SEARCH_EXIT" = "0" ] && [ "$VALIDATE_EXIT" = "0" ]
