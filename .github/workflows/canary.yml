# Canary semanal: ejecuta el recolector contra la fuente REAL
# con un caso conocido y abre (o actualiza) una incidencia si la salida no
# valida contra el esquema o si el código de salida es 4 (estructura cambiada).
name: Canary

on:
  schedule:
    - cron: "0 6 * * 1" # lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    name: Live run against the portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Subastas concluidas: permanecen en el portal y su estructura es estable.
      KNOWN_IDS: SUB-JA-2026-265003 SUB-RC-2026-07003001815
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Fetch the known case
        id: fetch
        run: |
          set +e
          boe-subastas fetch $KNOWN_IDS -o canary-fetch.jsonl 2> canary-fetch.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat canary-fetch.log

      - name: Search the source
        id: search
        run: |
          set +e
          boe-subastas search --province 07 --limit 3 -o canary-search.jsonl 2> canary-search.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat canary-search.log

      - name: Validate the output against the schema
        id: validate
        run: |
          set +e
          python scripts/validate_output.py canary-fetch.jsonl canary-search.jsonl
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload output and logs as an artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: canary-${{ github.run_number }}
          path: |
            canary-*.jsonl
            canary-*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Open or update the issue
        if: steps.fetch.outputs.exit == '4' || steps.search.outputs.exit == '4' || steps.validate.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FETCH_EXIT: ${{ steps.fetch.outputs.exit }}
          SEARCH_EXIT: ${{ steps.search.outputs.exit }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit }}
        run: |
          gh label create canary --description "Weekly canary alert" --color D93F0B --force > /dev/null 2>&1 || true
          title="Canary: the collector no longer parses the portal correctly"
          {
            echo "The weekly canary found a problem in run $RUN_URL"
            echo
            echo "- fetch of $KNOWN_IDS: exit code $FETCH_EXIT"
            echo "- search --province 07 --limit 3: exit code $SEARCH_EXIT"
            echo "- validation against schemas/item.schema.json: exit code $VALIDATE_EXIT"
            echo
            echo "Exit code 4 means the portal changed its structure and the parser needs maintenance."
            echo "The output files and logs are attached to the run as artifacts."
          } > issue-body.md
          number=$(gh issue list --label canary --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --title "$title" --label canary --body-file issue-body.md
          fi

      - name: Report the result
        if: always()
        env:
          FETCH_EXIT: ${{ steps.fetch.outputs.exit }}
          SEARCH_EXIT: ${{ steps.search.outputs.exit }}
          VALIDATE_EXIT: ${{ steps.validate.outputs.exit }}
        run: |
          echo "fetch=$FETCH_EXIT search=$SEARCH_EXIT validation=$VALIDATE_EXIT"
          [ "$FETCH_EXIT" = "0" ] && [ "$SEARCH_EXIT" = "0" ] && [ "$VALIDATE_EXIT" = "0" ]
