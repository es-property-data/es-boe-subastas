[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boe-subastas"
description = "Recolector del Portal de Subastas del BOE (subastas.boe.es)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selenium>=4.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
]
notebook = [
    "pandas>=2.0",
    "notebook>=7",
]

[project.urls]
repository = "https://github.com/es-property-data/es-boe-subastas"

[project.scripts]
boe-subastas = "boe_subastas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "boe_subastas.version.SCRAPER_VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
